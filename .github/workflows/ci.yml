name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: ./web/build.sh

      - name: Build
        run: dotnet build AmazonScraper.slnx -c Release --nologo

      - name: Test
        run: dotnet test AmazonScraper.slnx -c Release --no-build --nologo
